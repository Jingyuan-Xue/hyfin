[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a2rag"
version = "2.0.0-alpha.5"
description = "A graph-based retrieval augmented generation framework."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
  "torch>=2.6.0",
  "numpy>=2.0.0",
  "tqdm",
  "pandas>=2.2.3",
  "pyarrow",
  "python_igraph==0.11.8",
  "pydantic==2.10.4",
  "tenacity==8.5.0",
  "tiktoken==0.7.0",
  "filelock",
  "packaging",
  "fastapi==0.115.5",
  "uvicorn==0.30.6",
  "python-dotenv==1.0.1",
  "python-multipart==0.0.9",
  "langchain-text-splitters",
  "chonkie[semantic]",
  "sentence-transformers>=3.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
